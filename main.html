  <head>
    <title>Facebook Login</title>
    <style>
      body {
        background-color: #f6f6f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .left {
        width: 450px;
        margin-top: 70px;
        display: inline-block;
      }

      .left img {
        width: 300px;
        display: block;
      }

      .left p {
        font-size: 1.1rem;
        margin-top: 0;
      }

      .right {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 300px;
      }

      form {
        display: flex;
        width: 300px;
        background-color: white;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px #ccc;
        flex-direction: column;
        gap: 10px;
      }

      input {
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 10px;
      }

      form button {
        background-color: #1877f2;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
      }

      form a {
        text-decoration: none;
        color: #1877f2;
      }

      .signup {
        background-color: #42b72a;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Write your code here -->
    <div class="left">
      <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook logo">
      <p>Facebook helps you connect and share with the people in your life.</p>
    </div>

    <div class="right">
      <form>
        <input type="text" id="email" placeholder="Email address or phone number">
        <input type="password" id="password" placeholder="Password">
        <button type="submit">Log in</button>
        <a href="#">Forgotten account?</a>
      </form>
      <button class="signup">Create new account</button>
    </div>
  </body>
</html>
